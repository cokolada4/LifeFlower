# LifeFlower Configuration

# Global plugin enable/disable switch
enabled: true

# The punishment when a player dies without a valid LifeFlower.
# Options: SPECTATOR, BAN
punishment-type: BAN

# Whether to require direct sky access for the LifeFlower to be valid.
require-sky-access: true

# The material used for the LifeFlower. Default is POPPY.
# Note: Changing this won't automatically replace existing flowers in the world.
flower-material: POPPY

# CustomModelData for the LifeFlower item, useful for resource packs.
# Set to 0 or remove to disable.
custom-model-data: 1001

# Message sent to the player when they are eliminated.
elimination-message: "Your LifeFlower was missing or invalid! You have been eliminated."

# Particle Effects Configuration
particles:
  enabled: true
  # See materials_list.yml for all valid particle types
  type: HAPPY_VILLAGER
  # Number of particles spawned each interval
  count: 3
  # Spawn interval in ticks (20 ticks = 1 second)
  interval: 10
  # Particle spread on X, Y, Z axes
  spread-x: 0.3
  spread-y: 0.3
  spread-z: 0.3
  # Particle speed
  speed: 0.05
  # Whether particles should fall naturally (if the particle supports it)
  natural-fall: true

# Raid Tool Configuration
raid-tool:
  material: SHEARS
  name: "<gradient:gold:yellow>LifeFlower Removal Tool</gradient>"
  lore:
    - "<gray>A specialized tool for removing</gray>"
    - "<gray>another player's LifeFlower.</gray>"
  enchantment: FORTUNE
  level: 1
  exact-match: false
  durability: 3
  show-durability-in-lore: true
  durability-lore-format: "<gray>Remaining uses: <yellow>%uses%</yellow></gray>"
  # Message sent to a non-owner attempting to break a flower without the tool
  denied-message: "<red>You must use a LifeFlower Removal Tool to break someone else's LifeFlower!</red>"
  denied-sound: "ENTITY_VILLAGER_NO"

# Custom Recipe Configuration
recipe:
  enabled: true
  shape:
    - "DDD"
    - "DSD"
    - "DDD"
  ingredients:
    D: DIAMOND
    S: SHEARS
  output-amount: 1

# Revive Beacon Configuration
revive-beacon:
  name: "<gradient:aqua:blue>Revive Beacon</gradient>"
  lore:
    - "<gray>Use this to revive a</gray>"
    - "<gray>permanently eliminated player.</gray>"
  uses: 1
  show-uses-in-lore: true
  uses-lore-format: "<gray>Remaining uses: <yellow>%uses%</yellow></gray>"
  gui-title: "Select a player to revive"
  no-dead-players-message: "<red>There are no dead players to revive!</red>"
  revive-success-sender: "<green>You have revived %player%!</green>"
  revive-success-target: "<green>You have been revived by %sender%!</green>"

# Revive Beacon Recipe
revive-beacon-recipe:
  enabled: true
  shape:
    - "DDD"
    - "DBD"
    - "DDD"
  ingredients:
    D: DIAMOND
    B: BEACON
  output-amount: 1
